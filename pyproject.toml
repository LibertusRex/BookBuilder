[project]
name = "bookbuilder"
version = "0.1.0"
description = "Converte uma pasta de imagens de páginas em DOCX e EPUB editáveis, com OCR local."
requires-python = ">=3.12,<3.13"
# Versões fixas: o arquivo uv.lock trava também as dependências indiretas.
dependencies = [
    "lxml==6.1.3",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "pypdfium2==5.14.0",
    "pyside6==6.11.2",
    "python-docx==1.2.0",
    "rapid-layout==1.2.1",
    "rapidfuzz==3.14.6",
    "spylls==0.1.7",
]

[project.scripts]
bookbuilder = "bookbuilder.app:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
